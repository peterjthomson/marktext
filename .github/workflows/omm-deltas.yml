name: OMM deltas

# Oh My Marktext is a sister fork: the value is in a small, documented set of
# deltas against upstream MarkText. This job fails when a change to an upstream
# file is not recorded in docs/omm/EXTENSIONS.md, so divergence stays deliberate.
# See docs/omm/EXTENSIONS.md for the ledger and the merge runbook.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deltas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Fetch the pinned upstream release tag
        run: |
          UPSTREAM_TAG=$(node -p "require('./docs/omm/upstream.json').upstreamTag")
          git fetch --no-tags https://github.com/marktext/marktext.git "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"

      - name: Audit fork deltas against the ledger
        run: pnpm omm:deltas --check
        env:
          OMM_PREVIOUS_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
