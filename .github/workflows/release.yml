name: Release Oh My Marktext

on:
  push:
    # Broad trigger so the validate job can reject malformed v-tags
    # (e.g. `vbad.tag`) instead of them silently not triggering anything.
    tags:
      - 'v*'
  # Allows re-running a release against an existing tag, e.g. to add the
  # Windows/Linux artifacts to a release whose mac build was done locally:
  #   gh workflow run release.yml --ref v0.20.0-omm.1
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        run: |
          # workflow_dispatch can target a branch to produce artifacts without
          # publishing; only a tag ref needs to satisfy the version format.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Ref '${GITHUB_REF_NAME}' is not a tag; skipping semver validation."
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          # SemVer 2.0.0 with leading "v"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid semver (expected vX.Y.Z[-prerelease][+build])"
            exit 1
          fi
          echo "Tag '$tag' is valid."

  # Windows and Linux need no signing secrets, so they must never be gated on
  # the macOS Apple credentials. Build the matrix dynamically: mac is included
  # only when the signing secrets exist, because an unsigned mac build is worse
  # than no mac build for this fork — the whole point is a Gatekeeper-clean
  # install. When mac is excluded the release still ships win/linux.
  #
  # Intel mac (x64) is intentionally absent: Apple has ended the Intel
  # transition and arm64 is the only mac target we publish.
  preflight:
    name: Resolve build matrix
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      mac_signing: ${{ steps.resolve.outputs.mac_signing }}
    steps:
      - id: resolve
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          entries='{"name":"linux","os":"ubuntu-22.04","platform":"linux"}'
          entries="$entries"',{"name":"windows-x64","os":"windows-latest","platform":"windows","arch":"x64"}'
          entries="$entries"',{"name":"windows-arm64","os":"windows-11-arm","platform":"windows","arch":"arm64"}'

          mac_signing=false
          if [[ -n "$MAC_CERTS" && -n "$MAC_CERTS_PASSWORD" && -n "$APPLE_ID" \
                && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            mac_signing=true
            entries="$entries"',{"name":"macos-arm64","os":"macos-15","platform":"macos","arch":"arm64"}'
          else
            echo "::warning::macOS signing secrets absent — skipping the mac build. \
          Windows and Linux will still be released. Build and attach the signed mac \
          artifacts separately, or set MAC_CERTS, MAC_CERTS_PASSWORD, APPLE_ID, \
          APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID."
          fi

          echo "mac_signing=$mac_signing" >> "$GITHUB_OUTPUT"
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [validate, preflight]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4.3.1

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      - name: Install Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      # Cache Electron binary; key on package.json so it busts when Electron version changes.
      - name: Cache Electron binary
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      # Must be set before postinstall runs electron-rebuild
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: build-linux
        if: matrix.platform == 'linux'
        run: pnpm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mac builds are signed with a Developer ID Application certificate and
      # notarized by Apple, so Gatekeeper accepts them without any user-side
      # xattr workaround. Notarization can take up to ~30 minutes.
      #
      # The signing identity must be authorised for the appId in
      # electron-builder.yml (com.peterjthomson.ohmy-marktext).
      #
      # Per-arch script: electron-builder's --arm64/--x64 flags are additive
      # over the config's arch list, so electron-builder.yml must not pin
      # mac.target arches for the flag to actually restrict the build to a
      # single arch.
      # The `preflight` job owns the signing-secret check: mac is only in the
      # matrix when all five secrets exist, so reaching this step means signing
      # is configured.
      - name: build-mac
        if: matrix.platform == 'macos'
        run: pnpm run build:mac:${{ matrix.arch }}
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing: MAC_CERTS is the base64-encoded Developer ID .p12
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # Notarization (electron-builder reads these for mac.notarize: true)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: build-win
        if: matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: oh-my-marktext-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    # Only a tag push publishes. A workflow_dispatch run is for producing
    # artifacts against an existing tag (e.g. adding win/linux to a release
    # whose mac build was signed locally) and must not rewrite that release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Per-job permissions REPLACE workflow-level ones, so re-declare
    # both: contents:write to publish the release, actions:read for
    # download-artifact's Actions API calls.
    permissions:
      contents: write
      actions: read
    steps:
      # Deliberately NOT merge-multiple: every Windows arch emits its own
      # `latest.yml` describing only its own installer, so a flat merge lets
      # one arch silently clobber the other's update feed. Download into
      # per-artifact directories, reconcile the feeds, then flatten.
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts

      - name: Merge Windows update feeds and flatten into dist/
        run: |
          set -euo pipefail
          mkdir -p dist

          x64='artifacts/oh-my-marktext-windows-x64/latest.yml'
          arm64='artifacts/oh-my-marktext-windows-arm64/latest.yml'

          if [[ -f "$x64" && -f "$arm64" ]]; then
            # electron-updater resolves the right installer via the per-file
            # `arch` field; entries without one are treated as x64.
            yq eval-all '
              select(fi==0) as $x | select(fi==1) as $a |
              $x | .files += ($a.files | map(. + {"arch": "arm64"}))
            ' "$x64" "$arm64" > dist/latest.yml
            echo "Merged Windows update feeds:"
            cat dist/latest.yml
          fi

          # Flatten everything else, never overwriting the merged feed.
          find artifacts -type f ! -name 'builder-debug.yml' -print0 |
            while IFS= read -r -d '' f; do
              name="$(basename "$f")"
              [[ "$name" == 'latest.yml' && -f dist/latest.yml ]] && continue
              cp -n "$f" "dist/$name"
            done

          ls -1 dist

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          # Deterministic ordering so identical inputs always produce identical output
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          echo "---"
          cat SHA256SUMS.txt

      - name: Compose release notes body
        env:
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          {
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              echo "## ❗ This is a pre-release"
              echo "- May contain bugs and unfinished features."
              echo ""
            fi
            echo "## 🍎 macOS"
            echo "Builds are signed with a Developer ID certificate and notarized by Apple — just drag \"Oh My Marktext\" into Applications and open it. No \`xattr\` workaround needed."
            echo ""
            echo "## Based on MarkText"
            echo "Oh My Marktext is a sister fork of [MarkText](https://github.com/marktext/marktext). All credit for the editor and Muya engine goes to Jocs and the MarkText contributors."
            echo ""
            echo "## Verifying downloads"
            echo "All artifacts are listed with their SHA-256 in \`SHA256SUMS.txt\`. Verify with:"
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      # Immutable-release repos forbid adding assets to an already-published
      # release, and action-gh-release publishes before uploading the assets.
      # Create the release as a draft (assets allowed), then promote it to a
      # published release in the next step.
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2.6.2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote draft to published release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
